<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tài khoản | BookStore</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="top"><a class="brand" th:href="@{/}">📚 BookStore</a><nav><a th:href="@{/}">Trang chủ</a><a th:href="@{/cart}">Giỏ hàng</a><a th:href="@{/orders}">Đơn mua</a><form th:action="@{/logout}" method="post" class="inline"><button class="linkbtn">Đăng xuất</button></form></nav></header><main class="container"><h1>👤 Tài khoản của tôi</h1><p class="success" th:if="${success}" th:text="${success}"></p><p class="error" th:if="${error}" th:text="${error}"></p><div class="account-grid"><section class="panel"><div class="avatar" th:if="${profile.avatarUrl==null}">👤</div><img class="avatar" th:if="${profile.avatarUrl!=null}" th:src="${profile.avatarUrl}" alt="Ảnh đại diện"><h2 th:text="${profile.username}"></h2><form th:action="@{/account/avatar}" method="post" enctype="multipart/form-data"><label>Đổi ảnh đại diện (JPG/PNG/WEBP, tối đa 2 MB)<input type="file" name="avatar" accept="image/png,image/jpeg,image/webp" required></label><button class="btn small">Tải ảnh lên</button></form></section><section class="panel"><h2>Thông tin cá nhân</h2><form th:action="@{/account}" method="post"><label>Họ tên<input name="fullName" th:value="${profile.fullName}" required maxlength="120"></label><label>Tên đăng nhập<input th:value="${profile.username}" disabled></label><label>Email<input name="email" type="email" th:value="${profile.email}" maxlength="150"></label><label>Số điện thoại<input name="phone" th:value="${profile.phone}" maxlength="30"></label><label>Địa chỉ nhận hàng<input name="address" th:value="${profile.address}" maxlength="300"></label><button class="btn">Lưu thay đổi</button></form></section><section class="panel"><h2>Đổi mật khẩu</h2><form th:action="@{/account/password}" method="post"><label>Mật khẩu hiện tại<input type="password" name="currentPassword" required></label><label>Mật khẩu mới (ít nhất 8 ký tự)<input type="password" name="newPassword" minlength="8" required></label><label>Xác nhận mật khẩu<input type="password" name="confirmPassword" minlength="8" required></label><button class="btn">Đổi mật khẩu</button></form></section></div></main></body></html>
