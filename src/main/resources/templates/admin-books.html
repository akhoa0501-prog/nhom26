<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý sách</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="top"><a class="brand" th:href="@{/admin}">📚 BookStore Admin</a><nav><a th:href="@{/}">Cửa hàng</a><a th:href="@{/admin/orders}">Đơn hàng</a></nav></header><main class="container"><div class="section-title"><div><h1>Quản lý sách</h1><p>Thêm, sửa và xóa sách trong hệ thống.</p></div><a class="btn" th:href="@{/admin/books/new}">+ Thêm sách</a></div><p class="success" th:if="${param.saved}">Đã lưu sách thành công.</p><p class="success" th:if="${param.deleted}">Đã xóa sách.</p><div class="tablewrap"><table><thead><tr><th>ID</th><th>Tên sách</th><th>Tác giả</th><th>Danh mục</th><th>Giá</th><th>Kho</th><th>Thao tác</th></tr></thead><tbody><tr th:each="b:${books}"><td th:text="${b.id}"></td><td th:text="${b.title}"></td><td th:text="${b.author}"></td><td th:text="${b.category != null ? b.category.name : '-'}"></td><td th:text="${#numbers.formatDecimal(b.price,0,'COMMA',0,'POINT')} + ' đ'"></td><td th:text="${b.stock}"></td><td class="actions"><a class="btn small" th:href="@{/admin/books/edit/{id}(id=${b.id})}">Sửa</a><form th:action="@{/admin/books/delete/{id}(id=${b.id})}" method="post" onsubmit="return confirm('Bạn chắc chắn muốn xóa sách này?')"><button class="danger">Xóa</button></form></td></tr></tbody></table></div></main></body></html>
