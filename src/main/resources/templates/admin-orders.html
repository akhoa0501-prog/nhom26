<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý đơn hàng</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="top"><a class="brand" th:href="@{/admin}">📚 BookStore Admin</a><nav><a th:href="@{/admin/books}">Sách</a><a th:href="@{/}">Cửa hàng</a></nav></header><main class="container"><h1>Quản lý đơn hàng</h1><div class="tablewrap"><table><thead><tr><th>Mã đơn</th><th>Tài khoản</th><th>Người nhận</th><th>Điện thoại</th><th>Địa chỉ</th><th>Tổng tiền</th><th>Thanh toán</th><th>Trạng thái</th><th>Ngày tạo</th></tr></thead><tbody><tr th:each="o:${orders}"><td th:text="${o.id}"></td><td th:text="${o.username}"></td><td th:text="${o.receiverName}"></td><td th:text="${o.phone}"></td><td th:text="${o.address}"></td><td th:text="${#numbers.formatDecimal(o.total,0,'COMMA',0,'POINT')} + ' đ'"></td><td><span th:text="${o.paymentMethod}"></span><p th:text="${o.paymentStatus}"></p></td><td><form th:action="@{/admin/orders/{id}/status(id=${o.id})}" method="post"><select name="status"><option th:each="v : ${ {'Chờ xác nhận','Đang chuẩn bị','Đang giao','Hoàn thành','Đã hủy'} }" th:value="${v}" th:text="${v}" th:selected="${v == o.status}"></option></select><button class="btn small">Lưu</button></form><small th:text="${o.status}"></small></td><td th:text="${#temporals.format(o.createdAt,'dd/MM/yyyy HH:mm')}"></td></tr></tbody></table></div></main></body></html>
