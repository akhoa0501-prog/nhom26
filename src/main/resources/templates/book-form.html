<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thông tin sách</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="top"><a class="brand" th:href="@{/admin}">📚 BookStore Admin</a><nav><a th:href="@{/admin/books}">Quay lại danh sách</a></nav></header><main class="auth"><form class="panel" th:action="@{/admin/books/save}" th:object="${book}" method="post"><h1 th:text="${book.id == null ? 'Thêm sách mới' : 'Cập nhật sách'}"></h1><input type="hidden" th:field="*{id}"><div class="error" th:if="${#fields.hasErrors('*')}"><p th:each="e:${#fields.errors('*')}" th:text="${e}"></p></div><label>Tên sách<input th:field="*{title}" required></label><label>Tác giả<input th:field="*{author}" required></label><label>Giá (VNĐ)<input type="number" min="1" step="1000" th:field="*{price}" required></label><label>Số lượng kho<input type="number" min="0" th:field="*{stock}" required></label><label>Danh mục<select th:field="*{category.id}"><option value="">-- Chọn danh mục --</option><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}"></option></select></label><label>URL ảnh bìa<input th:field="*{coverUrl}" placeholder="https://..."></label><label>Mô tả<textarea th:field="*{description}" rows="4"></textarea></label><button class="btn full">Lưu sách</button></form></main></body></html>
