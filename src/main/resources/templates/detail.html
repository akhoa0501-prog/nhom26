<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chi tiết sách</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="top"><a class="brand" th:href="@{/}">📚 BookStore</a><nav><a th:href="@{/}">Trang chủ</a><a th:href="@{/cart}">Giỏ hàng</a><a th:href="@{/login}">Đăng nhập</a></nav></header><main class="container"><a th:href="@{/}" class="back">← Quay lại</a><section class="detail"><img th:src="${book.coverUrl}" alt="Bìa sách"><div><span class="tag" th:text="${book.category != null ? book.category.name : 'Chưa phân loại'}"></span><h1 th:text="${book.title}"></h1><p>Tác giả: <b th:text="${book.author}"></b></p><h2 class="price" th:text="${#numbers.formatDecimal(book.price,0,'COMMA',0,'POINT')} + ' đ'"></h2><p th:text="${book.description}"></p><p th:text="'Số lượng còn: ' + ${book.stock}"></p><form th:action="@{/cart/add/{id}(id=${book.id})}" method="post"><button class="btn" th:disabled="${book.stock <= 0}">Thêm vào giỏ hàng</button></form><form th:action="@{/favorites/{id}(id=${book.id})}" method="post"><button class="btn" type="submit">♡ Lưu / bỏ yêu thích</button></form><h3>Đánh giá sách</h3><div th:each="r:${reviews}"><b th:text="${r.rating}+' ★'"></b> <span th:text="${r.username}"></span><p th:text="${r.comment}"></p></div><form th:action="@{/books/{id}/reviews(id=${book.id})}" method="post"><select name="rating"><option th:each="n:${#numbers.sequence(1,5)}" th:value="${n}" th:text="${n}+' sao'"></option></select><input name="comment" maxlength="1000" placeholder="Nhận xét"><button type="submit">Gửi đánh giá (đơn đã hoàn thành)</button></form></div></section></main></body></html>
