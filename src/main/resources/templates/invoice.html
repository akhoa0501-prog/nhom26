<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>BookStore</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="container"><a href="/">← Trang chủ</a><h1>HÓA ĐƠN BOOKSTORE</h1><p th:text="'Mã đơn #'+${order.id}"></p><p th:text="${order.receiverName}"></p><p th:text="${order.address}"></p><table><tr><th>Sách</th><th>SL</th><th>Đơn giá</th></tr><tr th:each="i:${order.items}"><td th:text="${i.bookTitle}"></td><td th:text="${i.quantity}"></td><td th:text="${i.unitPrice}"></td></tr></table><h2 th:text="'Tổng: '+${order.total}+' đ'"></h2><button onclick="window.print()">In hóa đơn</button></main></body></html>
