<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="top"><a class="brand" th:href="@{/}">📚 BookStore</a><nav><a th:href="@{/}">Trang chủ</a><a th:href="@{/register}">Đăng ký</a></nav></header><main class="auth"><form class="panel" th:action="@{/login}" method="post"><p class="eyebrow">CHÀO MỪNG TRỞ LẠI</p><h1>Đăng nhập</h1><p class="success" th:if="${param.registered}">Đăng ký thành công, hãy đăng nhập.</p><p class="error" th:if="${param.error}">Tên đăng nhập hoặc mật khẩu không đúng.</p><p class="success" th:if="${param.logout}">Bạn đã đăng xuất.</p><label>Tên đăng nhập<input name="username" required autofocus></label><label>Mật khẩu<input type="password" name="password" required></label><button class="btn full">Đăng nhập</button><p class="muted center">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a></p></form></main></body></html>
