<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đơn hàng của tôi</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="top"><a class="brand" th:href="@{/}">📚 BookStore</a><nav><a th:href="@{/}">Trang chủ</a><a th:href="@{/cart}">Giỏ hàng</a></nav></header><main class="container"><h1>Đơn hàng của tôi</h1><div class="tablewrap" th:if="${!orders.isEmpty()}"><table><thead><tr><th>Mã đơn</th><th>Ngày đặt</th><th>Người nhận</th><th>Tổng tiền</th><th>Thanh toán</th><th>Trạng thái</th><th>Chi tiết</th></tr></thead><tbody><tr th:each="o:${orders}"><td th:text="${o.id}"></td><td th:text="${#temporals.format(o.createdAt,'dd/MM/yyyy HH:mm')}"></td><td th:text="${o.receiverName}"></td><td th:text="${#numbers.formatDecimal(o.total,0,'COMMA',0,'POINT')} + ' đ'"></td><td><span th:text="${o.paymentMethod == 'QR' ? 'QR Sandbox' : 'COD'}"></span><p th:text="${o.paymentStatus}"></p><a th:if="${o.paymentMethod == 'QR' and o.paymentStatus != 'DA_THANH_TOAN_MO_PHONG'}" th:href="@{/orders/{id}/payment(id=${o.id})}">Thanh toán thử</a></td><td><span class="tag" th:text="${o.status}"></span></td><td><a th:href="@{/orders/{id}/invoice(id=${o.id})}">Xem / in hóa đơn</a><br><span th:each="i:${o.items}" th:text="${i.bookTitle + ' x' + i.quantity + ' '}"></span></td></tr></tbody></table></div><div class="empty" th:if="${orders.isEmpty()}">Bạn chưa có đơn hàng nào.</div></main></body></html>
