<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Sandbox | BookStore</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="top"><a class="brand" th:href="@{/}">📚 BookStore</a><nav><a th:href="@{/orders}">Đơn hàng</a></nav></header><main class="container"><section class="checkout"><h1>Thanh toán QR Sandbox</h1><p class="error">MÔ PHỎNG PHỤC VỤ HỌC TẬP – KHÔNG CHUYỂN TIỀN THẬT, KHÔNG LIÊN KẾT NGÂN HÀNG.</p><div class="sandbox-qr" aria-label="QR mô phỏng không thể thanh toán">QR<br>DEMO</div><h2 th:text="'Đơn #' + ${order.id}"></h2><p>Tổng tiền: <strong th:text="${#numbers.formatDecimal(order.total,0,'COMMA',0,'POINT')} + ' đ'"></strong></p><p>Nhấn nút bên dưới để mô phỏng thanh toán thành công.</p><form th:action="@{/orders/{id}/payment/simulate(id=${order.id})}" method="post"><button class="btn">Xác nhận thanh toán thử nghiệm</button></form></section></main></body></html>
