<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="top"><a class="brand" th:href="@{/}">📚 BookStore</a><nav><a th:href="@{/}">Trang chủ</a><a th:href="@{/login}">Đăng nhập</a></nav></header><main class="auth"><form class="panel" th:action="@{/register}" th:object="${user}" method="post"><p class="eyebrow">THÀNH VIÊN BOOKSTORE</p><h1>Tạo tài khoản</h1><p class="error" th:if="${error}" th:text="${error}"></p><label>Họ và tên<input th:field="*{fullName}" required maxlength="120"></label><label>Tên đăng nhập<input th:field="*{username}" required minlength="3" maxlength="60"></label><label>Email<input type="email" th:field="*{email}"></label><label>Mật khẩu<input type="password" th:field="*{password}" required minlength="6"></label><button class="btn full">Đăng ký</button><p class="muted center">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p></form></main></body></html>
